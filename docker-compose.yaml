#    image: server_client:latest
#    container_name: client
#    command: "-config_file=config/client/config.toml"
#    volumes:
#      - "./config/client/:/app/config/client"
#      - "./config/cert/:/app/config/cert"
#      - "./config/csv/:/app/config/csv"
#    environment:
#      TZ: "Asia/Shanghai"
#      TERM: "xterm-256color"
#    depends_on:
#      - "gate"
#    ports:
#      - "8083:8083"
#    stdin_open: true
#    tty: true

  client_bots:
    image: client_bots:latest
    container_name: client_bots
    command: "-config_file=config/client_bots/config.toml"
    volumes:
      - "./config/client_bots/:/app/apps/client_bots/config/client_bots"
      - "./config/cert/:/app/apps/client_bots/config/cert"
      - "./config/csv/:/app/apps/client_bots/config/csv"
    environment:
      TZ: "Asia/Shanghai"
    networks:
      - server-network
    depends_on:
      - "gate"
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    ports:
      - "3100:3100"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - ./config/loki/:/etc/loki
      - ./data/loki/:/tmp/loki
    command: -config.file=/etc/loki/loki-local-config.yaml
    restart: unless-stopped

  game:
    image: game:latest
    container_name: game
    command: ["/app/server/apps/game/game", "--config_file", "config/game/config.toml"]
    ports:
      - "7030:7030"
      - "8091:8091"
      - "8445:8445"
      - "4433:4433"
    volumes:
      - "./config/game/:/app/server/config/game"
      - "./config/cert/:/app/server/config/cert"
      - "./config/csv/:/app/server/config/csv"
      - "./scripts/:/app/server/scripts"
    environment:
      TZ: "Asia/Shanghai"
      MICRO_REGISTRY: "mdns"
      DB_DSN: "mongodb://mongo:27017"
      PUBLIC_IP: "game"
    networks:
      - server-network
    depends_on:
      - "mongo"
    stop_grace_period: 10s
    stop_signal: SIGTERM
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"


  gate:
    image: gate:latest
    container_name: gate
    command: ["/app/server/apps/gate/gate", "--config_file", "config/gate/config.toml"]
    volumes:
      - "./config/gate/:/app/server/config/gate"
      - "./config/cert/:/app/server/config/cert"
      - "./config/csv/:/app/server/config/csv"
    ports:
      - "8081:8081"
      - "8443:8443"
      - "7080:7080"
    # 如果需要使用80/443端口，取消下面的注释
    # privileged: true
    environment:
      TZ: "Asia/Shanghai"
      MICRO_REGISTRY: "mdns"
      # MICRO_REGISTRY_ADDRESS: "consul:8500"
      # MICRO_BROKER: "nsq"
      # MICRO_BROKER_ADDRESS: "nsqd:4150"
      # MICRO_SYNC_NODE_ADDRESS: "consul:8500"
      DB_DSN: "mongodb://mongo:27017"
      # REDIS_ADDR: "rejson:6379"
      # GAME_SERVICE_ADDRESS: "game:7030"  # 注释掉，使用服务发现
    depends_on:
      # - "consul"
      # - "nsqd"
      - "loki"
      - "mongo"
      - "game"
    networks:
      - server-network
    stop_grace_period: 10s
    stop_signal: SIGTERM
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

  mail:
    image: mail:latest
    container_name: mail
    # command: "-config_file=config/mail/config.toml"
    volumes:
      - "./config/mail/:/app/server/config/mail"
      - "./config/cert/:/app/server/config/cert"
      - "./config/csv/:/app/server/config/csv"
    ports:
      - "8180:8180"
      - "8453:8453"
    environment:
      TZ: "Asia/Shanghai"
      MICRO_REGISTRY: "mdns"
      # MICRO_REGISTRY_ADDRESS: "consul:8500"
      # MICRO_BROKER: "nsq"
      # MICRO_BROKER_ADDRESS: "nsqd:4150"
      # MICRO_SYNC_NODE_ADDRESS: "consul:8500"
      DB_DSN: "mongodb://mongo:27017"
      # REDIS_ADDR: "rejson:6379"
    depends_on:
      # - "consul"
      # - "nsqd"
      - "loki"
      - "mongo"
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

  rank:
    image: rank:latest
    container_name: rank
    # command: "-config_file=config/rank/config.toml"
    volumes:
      - "./config/rank/:/app/server/config/rank"
      - "./config/cert/:/app/server/config/cert"
      - "./config/csv/:/app/server/config/csv"
    ports:
      - "8190:8190"
      - "8463:8463"
    environment:
      TZ: "Asia/Shanghai"
      MICRO_REGISTRY: "mdns"
      # MICRO_REGISTRY_ADDRESS: "consul:8500"
      # MICRO_BROKER: "nsq"
      # MICRO_BROKER_ADDRESS: "nsqd:4150"
      # MICRO_SYNC_NODE_ADDRESS: "consul:8500"
      DB_DSN: "mongodb://mongo:27017"
      # REDIS_ADDR: "rejson:6379"
    depends_on:
      # - "consul"
      # - "nsqd"
      - "loki"
      - "mongo"
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

  comment:
    image: comment:latest
    container_name: comment
    # command: "-config_file=config/comment/config.toml"
    volumes:
      - "./config/comment/:/app/server/config/comment"
      - "./config/cert/:/app/server/config/cert"
      - "./config/csv/:/app/server/config/csv"
    ports:
      - "8200:8200"
      - "8473:8473"
    environment:
      TZ: "Asia/Shanghai"
      MICRO_REGISTRY: "mdns"
      # MICRO_REGISTRY_ADDRESS: "consul:8500"
      # MICRO_BROKER: "nsq"
      # MICRO_BROKER_ADDRESS: "nsqd:4150"
      # MICRO_SYNC_NODE_ADDRESS: "consul:8500"
      DB_DSN: "mongodb://mongo:27017"
      # REDIS_ADDR: "rejson:6379"
    depends_on:
      # - "consul"
      # - "nsqd"
      - "loki"
      - "mongo"
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"
        
  mongo:
    image: mongo:5.0
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      TZ: "Asia/Shanghai"
      MONGO_INITDB_DATABASE: game
    volumes:
      - ./config/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - /home/speitzerlau/mongo-data:/data/db
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: http://host.docker.internal:3100/api/prom/push
    #     loki-retries: "5"
    #     loki-batch-size: "400"

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44.0
    container_name: mongodb-exporter
    restart: unless-stopped
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
      - '--log.level=debug'
    environment:
      TZ: "Asia/Shanghai"
    depends_on:
      - mongo
    networks:
      - server-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9216/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # rejson:
  #   image: redislabs/rejson
  #   command: 
  #     - /usr/local/etc/redis/redis.conf 
  #     - --loadmodule /usr/lib/redis/modules/rejson.so
  #   container_name: rejson
  #   ports:
  #     - 6379:6379
  #   volumes:
  #     - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
  #     - ./data/redis/:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli","ping"]
  #     interval: 20s
  #     timeout: 1s
  #     retries: 20
    # depends_on:
    #   - loki
    # logging:
    #   driver: loki
    #   options:
    #     loki-url: http://host.docker.internal:3100/api/prom/push
    #     loki-retries: "5"
    #     loki-batch-size: "400"

  consul:
    image: consul:1.15.4
    command: "agent -server -bootstrap-expect=1 -bind=127.0.0.1 -enable-local-script-checks -log-level=info -config-dir=/config/consul -data-dir=/consul_data -ui -client=0.0.0.0"
    container_name: consul
    ports:
      - "8500:8500"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - "./config/consul/:/config/consul/"
      - "./data/consul/:/consul_data"
    depends_on:
      - loki
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

  nsqlookupd:
    image: nsqio/nsq
    command: /nsqlookupd -log-level=info
    container_name: nsqlookupd
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"
    depends_on:
      - loki
    ports:
      - "4160:4160"
      - "4161:4161"
    environment:
      TZ: "Asia/Shanghai"

  nsqd:
    image: nsqio/nsq
    command: /nsqd --data-path=/nsq_data -log-level=info -lookupd-tcp-address=nsqlookupd:4160 
    container_name: nsqd
    volumes:
      - "./data/nsq/:/nsq_data"
    ports:
      - "4150:4150"
      - "4151:4151"
    environment:
      TZ: "Asia/Shanghai"
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

    depends_on:
      - nsqlookupd
      - nsqadmin
      - loki

  nsqadmin:
    image: nsqio/nsq
    command: /nsqadmin -lookupd-http-address=nsqlookupd:4161
    container_name: nsqadmin
    depends_on:
      - nsqlookupd  
      - loki
    ports:
      - "4171:4171"
    environment:
      TZ: "Asia/Shanghai"
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

  promtail:
    image: grafana/promtail
    container_name: promtail
    volumes:
      - ./config/promtail/:/etc/promtail
      - /var/log:/var/log
    environment:
      TZ: "Asia/Shanghai"
    command:
      -config.file=/etc/promtail/promtail-docker-config.yaml

  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
        # - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini
        - ./data/grafana/:/var/lib/grafana/
    ports:
        - "3000:3000"
    networks:
        - server-network
    extra_hosts:
        - "host.docker.internal:host-gateway"
    user: "472"
    environment:
      GF_EXPLORE_ENABLED: "true"
      TZ: "Asia/Shanghai"
#     logging:
#       driver: loki
#       options:
#         loki-url: http://host.docker.internal:3100/api/prom/push
#         loki-retries: "5"
#         loki-batch-size: "400"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
        - "0.0.0.0:9090:9090"  # 绑定到所有网络接口
    volumes:
        - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - server-network
    environment:
      TZ: "Asia/Shanghai"

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter
    volumes:
        - /:/host:ro
    hostname: "macbook pro 2017"
    restart: always
    ports:
        - "9100:9100"
    networks:
      - server-network
    environment:
      TZ: "Asia/Shanghai"

networks:
  server-network:
    driver: bridge
