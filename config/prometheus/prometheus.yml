global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'gate'
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gate:8081']

  - job_name: 'game'
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['172.17.64.196:8091']

  - job_name: 'mongodb'
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'node'
    scrape_interval: 8s
    scrape_timeout: 6s
    static_configs:
      - targets: ['node-exporter:9100']

