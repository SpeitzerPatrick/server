# config.toml

title = "clientBots_config"

debug = true
log_level = "info"

heart_beat = "5s"

#prompt ui
prompt_ui = false

# tls config
cert_path_debug = "config/cert/localhost.crt"
key_path_debug = "config/cert/localhost.key"

cert_path_release = "config/cert/hellodudu.crt"
key_path_release = "config/cert/hellodudu.key"

client_bots_num = 3  # 进一步减少到3个，避免channel阻塞

# http
http_listen_addr = ":8083"

gate_addr = "gate:7080"

# MongoDB configuration for stress testing
db_dsn = "mongodb://mongo:27017"
database = "game"
